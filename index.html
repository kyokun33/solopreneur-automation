<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loss Scorecard Simulation - 고고플랙스</title>
    <style>
        /* =============================== */
        /* 🎨 CSS: Apple-Style Minimalist & State Definition */
        /* =============================== */

        :root {
            --color-text-default: #1D1D1F; /* 진한 회색 본문 텍스트 */
            --color-bg-light: #FFFFFF;
            --color-accent-primary: #007AFF; /* Apple Blue, CTA 버튼 기본 색상 */
            /* 상태별 컬러 정의 (Self-RAG 기반) */
            --color-safe: #5CB85C; /* 녹색 계열 (안전/정상) */
            --color-warning: #FFCC00; /* 노란색/주황색 (경고/위험) */
            --color-panic: #CC3333; /* 빨간색 (패닉/최대 위험) */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--color-bg-light);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            width: 100%;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            border-radius: 16px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: var(--color-text-default);
            line-height: 1.3;
        }

        /* --- Loss Scorecard Widget Core --- */
        #loss-scorecard {
            background-color: #f9f9fb;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            transition: all 0.5s ease-in-out; /* 상태 변화의 부드러운 전환 */
            border: 1px solid #eee;
        }

        /* ============================= */
        /* STATE CHANGE VISUAL EFFECTS (핵심) */
        /* ============================= */

        /* 🚨 경고 상태 (Warning State - $1,500 초과) */
        .warning-state {
            border-color: var(--color-warning) !important;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.3); /* 은은한 노란색 발광 */
        }

        /* 🔥 패닉 상태 (Panic State - $2,500 초과) */
        .panic-state {
            border-color: var(--color-panic) !important;
            box-shadow: 0 0 30px rgba(204, 51, 51, 0.6); /* 강한 빨간색 발광 및 경고 */
        }

        /* 시각적 충격 효과 (애니메이션) */
        @keyframes glitch {
            0% { transform: translate(-2px, -2px); opacity: 1; }
            50% { transform: translate(2px, 2px); opacity: 0.9; }
            100% { transform: translate(-2px, 2px); opacity: 1; }
        }

        /* 패닉 상태에서 적용되는 깜빡임 효과 (빨간 필터 시뮬레이션) */
        .panic-state::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: rgba(204, 51, 51, 0.1); /* 빨간 투명 필터 */
            animation: glitch 0.1s infinite alternate;
            pointer-events: none;
        }

        /* 손실 카운터 스타일링 */
        #loss-counter {
            font-size: 4rem;
            font-weight: 700;
            color: var(--color-panic); /* 기본적으로 가장 중요한 색상으로 설정 */
            transition: color 0.5s ease;
        }

        /* Breakdown Chart Placeholder */
        #breakdown-chart {
            margin-top: 30px;
            padding: 20px;
            background-color: #eee;
            border-radius: 8px;
            min-height: 150px;
            text-align: center;
        }

        /* CTA 버튼 스타일 */
        .cta-button {
            display: inline-block;
            padding: 14px 32px;
            margin-top: 40px;
            background-color: var(--color-accent-primary);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }

        .cta-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚨 당신의 기업은 안전한가요?</h1>
    <h2>데이터 무결성 실패로 인한 잠재적 재무 손실 시뮬레이터</h2>
    <p style="margin-bottom: 30px; color: #666;">(시간이 지남에 따라 발생하는 가상의 리스크를 체험해보세요.)</p>

    <!-- 핵심 인터랙티브 위젯 -->
    <div id="loss-scorecard">
        <h3>🔥 누적 예상 손실액 (Estimated Loss)</h3>
        <p style="font-size: 1.2rem; margin-bottom: 20px;">🚨 현재 리스크 지수:</p>
        <div id="loss-counter">$0</div>
    </div>

    <!-- 손실 Breakdown 섹션 -->
    <h3 style="margin-top: 40px;">📊 손실 구성 분석 (Loss Breakdown)</h3>
    <div id="breakdown-chart">
        [여기에 데이터 시각화 차트가 로드됩니다. 시간/규제 미준수 비율을 보여줍니다.]
    </div>

    <!-- CTA -->
    <button class="cta-button" onclick="alert('전문 진단 페이지로 이동합니다. (CTA)')">
        즉시 리스크 무료 점검 받기 (Click to Save)
    </button>
</div>

<script>
    // ===============================
    // 💻 JavaScript: Loss Scorecard 로직 정의 (State Machine)
    // ===============================

    const $lossCounter = document.getElementById('loss-counter');
    const $scoreCard = document.getElementById('loss-scorecard');
    const TIME_INTERVAL = 1500; // 1.5초마다 리스크 계산 및 업데이트
    let currentLoss = 0;

    // 임계점 정의 (지난 의사결정 로그 기반)
    const THRESHOLD = {
        WARNING: 1500, // $1,500 초과 시 경고
        PANIC: 2500   // $2,500 초과 시 패닉 상태
    };

    /**
     * @function calculateLoss - 손실액을 누적하고 리스크를 계산합니다.
     */
    function calculateLoss() {
        // 시뮬레이션 로직: 시간에 비례하여 손실 발생 (단순화)
        const lossIncrease = Math.floor(Math.random() * 50) + 10; // 10 ~ 60 달러 증가
        currentLoss += lossIncrease;

        console.log(`[Logic] Loss increased by ${lossIncrease}. Total: $${Math.round(currentLoss)}`);
    }

    /**
     * @function updateUI - 현재 손실액에 따라 UI의 상태를 업데이트하고 시각적 효과를 적용합니다. (핵심)
     */
    function updateUI() {
        // 1. 카운터 업데이트 (Smooth Counter Up Effect 구현 대신, 간결성을 위해 바로 할당)
        $lossCounter.textContent = `$${Math.round(currentLoss).toLocaleString()} (${Math.round(currentLoss / 1000)}k)`;

        let state = 'safe'; // 기본 상태
        let message = '현재 리스크는 관리 가능한 범위 내에 있습니다.';
        let color = '#333';

        // 2. State Change 로직 실행
        if (currentLoss >= THRESHOLD.PANIC) {
            state = 'panic';
            message = '🔥 경고: 치명적 리스크 도달! 즉각적인 프로세스 점검이 필요합니다.';
            color = 'var(--color-panic)'; // 빨간색 패닉 색상
        } else if (currentLoss >= THRESHOLD.WARNING) {
            state = 'warning';
            message = '⚠️ 주의: 데이터 무결성 위협 감지! 손실을 막기 위한 대응이 필요합니다.';
            color = 'var(--color-warning)'; // 노란색 경고 색상
        }

        // 3. DOM 상태 클래스 변경 (State Change 반영)
        $scoreCard.className = ''; // 기존 클래스 초기화
        if (state === 'panic') {
             $scoreCard.classList.add('panic-state');
        } else if (state === 'warning') {
            $scoreCard.classList.add('warning-state');
        }

        // 4. 카운터 색상 및 메시지 업데이트
        $lossCounter.style.color = color;
        document.querySelector('#loss-scorecard h3').textContent = `🔥 누적 예상 손실액 (Estimated Loss) - ${message}`;

    }

    /**
     * @function initializeSimulation - 전체 시뮬레이션을 시작합니다.
     */
    function initializeSimulation() {
        console.log("Loss Scorecard Simulation Initialized.");
        // 초기 UI 상태 설정
        updateUI(); 
        // 주기적으로 손실 계산 및 UI 업데이트 실행 (자동화 루틴)
        setInterval(() => {
            calculateLoss();
            updateUI();
        }, TIME_INTERVAL);
    }

    // 페이지 로드 시 자동 실행
    window.onload = initializeSimulation;

</script>

</body>
</html>
