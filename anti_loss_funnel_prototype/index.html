<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚨 고고플랙스 Anti-Loss Funnel E2E Prototype</title>
    <style>
        /* 🍎 Apple-style Minimalist Base & Color Palette */
        :root {
            --primary-bg: #FFFFFF; /* Primary Background - Pure White */
            --secondary-bg: #F5F5F7; /* Secondary Background - Light Gray */
            --text-color: #1D1D1F; /* Deep Charcoal - Main Text */
            --tech-blue: #0066CC; /* Primary Accent - Trust/CTA (Default) */
            --warning-red: #CC3333; /* Loss Accent - Danger/Warning Red */

            /* Transition and Animation Base */
            transition: background-color 0.5s ease, color 0.5s ease, box-shadow 0.5s ease;
        }

        body {
            font-family: 'Inter', 'Apple SD Gothic Neo', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-color);
            line-height: 1.6;
            padding: 40px 20px;
            margin: 0;
        }

        /* === Core Layout & Typography === */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            text-align: center;
        }

        header h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            color: var(--tech-blue); /* H1 uses primary accent initially */
            font-weight: 800;
            margin-bottom: 10px;
        }

        p.subtitle {
            font-size: clamp(1rem, 2vw, 1.5rem);
            color: #666;
            margin-bottom: 40px;
        }

        /* === Loss Scorecard Widget (The Core Focus) === */
        #loss-scorecard {
            background-color: var(--secondary-bg);
            border-radius: 12px;
            padding: 50px;
            margin: 40px auto;
            max-width: 800px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); /* Soft Shadow */
            transition: all 0.5s ease-in-out;
        }

        /* Loss Counter Display - The most prominent element */
        #loss-counter {
            font-size: clamp(3rem, 10vw, 6rem);
            font-weight: 900;
            margin: 20px 0;
            color: var(--tech-blue); /* Default Blue */
            transition: color 0.5s ease;
        }

        #loss-counter span {
            display: block;
            font-size: clamp(1.8rem, 6vw, 2.5rem);
            font-weight: 600;
            color: #999;
        }

        /* Transparency/Trust Section */
        #loss-breakdown {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            margin-top: 30px;
            padding: 20px 0;
            border-top: 1px solid #eee;
        }

        .breakdown-item {
            flex: 1;
            text-align: center;
        }

        .breakdown-value {
            font-size: 2rem;
            font-weight: 700;
            margin-top: 5px;
        }

        /* Input Form Styling */
        #input-form {
            background-color: var(--primary-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 40px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            margin-top: 30px;
        }

        label {
            font-weight: 600;
            color: var(--text-color);
            display: block;
            margin-bottom: 8px;
        }

        input[type="number"] {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 100%;
            max-width: 350px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--tech-blue);
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.2);
        }

        /* === CTA Button Styling (The Mini-Commitment Loop) === */
        #cta-button {
            padding: 15px 50px;
            font-size: 1.3rem;
            font-weight: bold;
            border: none;
            cursor: pointer;
            border-radius: 50px; /* Squircles */
            transition: transform 0.2s, background-color 0.4s, box-shadow 0.4s;
            background-color: var(--tech-blue);
            color: white;
            box-shadow: 0 6px 15px rgba(0, 102, 204, 0.3);
        }

        #cta-button:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 20px rgba(0, 102, 204, 0.5);
        }

        /* === State Machine Visual Effects (Warning/Critical) === */

        /* Warning State ($1,500+) */
        body.warning-state {
            background-color: #FFF8F8; /* Very light red wash */
        }
        #loss-scorecard.warning-state {
             border: 2px solid var(--warning-red);
             box-shadow: 0 15px 40px rgba(204, 51, 51, 0.3); /* Red Shadow */
        }
        #loss-counter.warning-state {
            color: var(--warning-red);
        }

        /* Critical State (Loss > $3,000) */
        body.critical-state {
            background-color: #FFEBEB; /* Deeper red wash */
        }
        #loss-scorecard.critical-state {
             border: 4px solid var(--warning-red);
             transform: scale(1.02); /* Slight visual emphasis */
        }
        #loss-counter.critical-state {
            color: #B30000; /* Deeper, more urgent red */
        }

        /* Glitch Effect (Visual Panic) - CSS Animation */
        @keyframes glitch {
            0%, 100% { transform: translate(0); opacity: 1; }
            20% { transform: translate(-4px, 4px); opacity: 0.8; }
            40% { transform: translate(4px, -4px); opacity: 0.9; }
            60% { transform: translate(-2px, -2px); opacity: 1; }
            80% { transform: translate(2px, 2px); opacity: 0.7; }
        }

        .glitch-active {
            animation: glitch 0.3s infinite alternate;
            text-shadow: -4px 4px #ff0000, 4px -4px #0000ff; /* Glitch text effect */
        }

    </style>
</head>
<body>

<div class="container">
    <header>
        <!-- H1이 상태 변화에 따라 클래스를 받아 글리치 효과를 적용함 -->
        <h1 id="main-hook-title">🚨 당신의 비즈니스, 지금 손실되고 있습니다.</h1>
        <p class="subtitle">손실액 $L$을 실시간으로 정량화하여 리스크를 직면하십시오. (Anti-Loss Funnel Test Environment)</p>
    </header>

    <!-- 1. 입력 및 데이터 정의 섹션 -->
    <section id="input-form">
        <h2>📉 손실 원인 입력: 데이터를 통한 위기감 증폭</h2>
        <div class="input-group">
            <div>
                <label for="time-loss">시간 손실분 (예상 시간):</label>
                <input type="number" id="time-loss" value="25" min="0" required oninput="updateLoss()">
            </div>
            <div>
                <label for="risk-cost">규제/법적 리스크 비용 (추정 $L$):</label>
                <input type="number" id="risk-cost" value="3000" min="0" required oninput="updateLoss()">
            </div>
        </div>
    </section>

    <!-- 2. Loss Scorecard Display & Funnel Climax -->
    <div id="loss-scorecard">
        <h2>🔥 당신의 현재 손실 점수 (The Anti-Loss Hook)</h2>
        <p style="font-size: 1.2rem; color: #666;">손실 = (시간 * 가치) + 리스크 비용</p>

        <!-- 이 영역이 상태 변화에 따라 Red/Glitch 효과를 받습니다 -->
        <div id="loss-counter" class="glitch-active">
            $<span id="total-loss">$0</span>
            <span>(Loss Scorecard Value)</span>
        </div>

        <!-- 투명성 확보 (Self-RAG 필수 요소) -->
        <div id="loss-breakdown">
            <div class="breakdown-item">
                <p>⏰ 시간 손실분</p>
                <span id="time-loss-display" class="breakdown-value">$0</span>
            </div>
            <div class="breakdown-item">
                <p>⚖️ 리스크 비용</p>
                <span id="risk-cost-display" class="breakdown-value">$0</span>
            </div>
        </div>

        <!-- 3. Call To Action (Anti-Loss Funnel CTA) -->
        <div style="margin-top: 60px;">
             <button id="cta-button" onclick="simulatePurchase()">💰 손실 방지 및 즉시 시작하기</button>
             <p style="color: #999; margin-top: 15px; font-size: 0.9rem;">(CTA 클릭 시 Mini-Commitment Loop 진입 예상)</p>
        </div>
    </div>

</div>

<script>
    // Global Variables and Constants
    const TIME_VALUE = 55; // 시간당 가치 ($/hour) - Self-RAG 근거
    const THRESHOLD_WARNING = 1500; // $1,500 임계점 (Mini-Commitment Loop Trigger)
    const THRESHOLD_CRITICAL = 3000; // $3,000 임계점 (Critical State Trigger)

    // DOM Elements
    const timeLossInput = document.getElementById('time-loss');
    const riskCostInput = document.getElementById('risk-cost');
    const totalLossDisplay = document.getElementById('total-loss');
    const timeLossDisplay = document.getElementById('time-loss-display');
    const riskCostDisplay = document.getElementById('risk-cost-display');
    const ctaButton = document.getElementById('cta-button');
    const body = document.body;
    const lossScorecard = document.getElementById('loss-scorecard');
    const mainHookTitle = document.getElementById('main-hook-title');

    /**
     * 1. Loss Calculation Core Logic (Anti-Loss Funnel)
     */
    function calculateLoss(time, riskCost) {
        // Formula: Total Loss = (Time * Value/hr) + Risk Cost
        const timeLossAmount = Math.round(parseFloat(time) * TIME_VALUE);
        const totalLoss = Math.max(0, timeLossAmount + parseFloat(riskCost));
        return { timeLossAmount, totalLoss };
    }

    /**
     * 2. UI State Machine Update Function (The core interactive logic)
     */
    function updateLoss() {
        const time = parseFloat(timeLossInput.value) || 0;
        const riskCost = parseFloat(riskCostInput.value) || 0;

        // 1. Calculate Loss and Update Display
        const result = calculateLoss(time, riskCost);
        const totalLoss = Math.round(result.totalLoss);

        // Update Display Values
        totalLossDisplay.textContent = totalLoss.toLocaleString();
        timeLossDisplay.textContent = `${Math.round(result.timeLossAmount).toLocaleString()}원`; // Using Korean currency symbol for effect
        riskCostDisplay.textContent = `${Math.round(result.riskCost).toLocaleString()}원`;

        // 2. State Machine Logic (Color, Glitch, Text)
        resetState(); // Reset any previous state effects first

        if (totalLoss >= THRESHOLD_CRITICAL) {
            // Critical State: Loss > $3000
            applyCriticalState(totalLoss);
        } else if (totalLoss >= THRESHOLD_WARNING) {
            // Warning State: $1500 <= Loss < $3000
            applyWarningState(totalLoss);
        } else {
            // Safe/Low Risk State: Loss < $1500
            resetToSafeState();
        }

        // 3. Update CTA Button Copy based on loss amount
        updateCtaButton(totalLoss, time, riskCost);
    }

    /**
     * State Handlers
     */
    function applyWarningState(loss) {
        body.classList.add('warning-state');
        lossScorecard.classList.add('warning-state');
        mainHookTitle.textContent = `⚠️ 경고! 당신의 손실액은 이미 ${Math.round(THRESHOLD_WARNING / 100)}%를 초과했습니다.`;
        mainHookTitle.style.color = 'var(--warning-red)';
    }

    function applyCriticalState(loss) {
        body.classList.add('critical-state');
        lossScorecard.classList.add('critical-state');
        mainHookTitle.textContent = `🚨 CRITICAL! 손실액 ${Math.round(loss / 100)}% 초과, 즉시 조치가 필요합니다.`;
        mainHookTitle.style.color = '#B30000'; // Deeper Red for Critical
    }

    function resetToSafeState() {
        body.classList.remove('warning-state', 'critical-state');
        lossScorecard.classList.remove('warning-state', 'critical-state');
        mainHookTitle.textContent = `🚨 당신의 비즈니스, 지금 손실되고 있습니다.`;
        mainHookTitle.style.color = 'var(--tech-blue)';
    }

    function resetState() {
         // Remove state classes and glitch effect on input change
        body.classList.remove('warning-state', 'critical-state');
        lossScorecard.classList.remove('warning-state', 'critical-state');
        mainHookTitle.classList.remove('glitch-active');
    }


    /**
     * 3. CTA Button Logic (Mini-Commitment Loop)
     */
    function updateCtaButton(totalLoss, time, riskCost) {
        let buttonText;
        if (totalLoss === 0) {
            buttonText = "손실을 계산하고 해결책 찾기";
        } else if (totalLoss < THRESHOLD_WARNING * 0.8) {
             buttonText = `시간 확보 ${Math.round(time)}시간 돌려받기`; // Focus on Time Savings
        } else if (totalLoss >= THRESHOLD_WARNING && totalLoss < THRESHOLD_CRITICAL) {
            buttonText = `🔥 $1,500 손실 방지 진단 감사 신청하기`; // Funnel Trigger Point
        } else {
            buttonText = `🚨 긴급! 모든 리스크 차단 (최종 Audit)`; // Critical CTA
        }
        ctaButton.textContent = buttonText;

    }

    /**
     * 4. Simulated Purchase/Audit Flow (Final Action)
     */
    function simulatePurchase() {
        const totalLossValue = parseFloat(totalLossDisplay.textContent.replace(/,/g, ''));
        alert(`[System Alert] Anti-Loss Funnel Activated!\n\n당신의 현재 손실액 $${Math.round(totalLossValue)}에 대한 진단 요청을 접수했습니다.\n다음 단계: Mini-Commitment Loop (Paid Diagnostic Audit) 시작. ➡️ 결제 페이지로 이동합니다.`);
        // In a real scenario, this would redirect to the Payment/Audit page.
    }

    // Initialize the prototype on load
    window.onload = updateLoss;
</script>
</body>
</html>
