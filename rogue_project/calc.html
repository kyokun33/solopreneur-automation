<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>GogoFlex 고감독 스마트 웹 계산기</title>
    <style>
        body { background: #0b0c10; color: #66fcf1; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .calc-box { background: #1f2833; padding: 25px; border-radius: 16px; border: 2px solid #45a29e; box-shadow: 0 0 30px rgba(102, 252, 241, 0.3); width: 320px; }
        #display { width: 100%; height: 60px; background: #0b0c10; border: 1px solid #45a29e; color: #66fcf1; font-size: 2rem; text-align: right; padding: 10px; margin-bottom: 20px; border-radius: 8px; box-sizing: border-box; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        button { padding: 15px; font-size: 1.2rem; border-radius: 8px; border: none; background: #c5c6c7; color: #0b0c10; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #ffffff; }
        button.op { background: #45a29e; color: #fff; }
        button.eq { background: #66fcf1; color: #0b0c10; grid-column: span 2; }
        button.c { background: #ff4d4d; color: #fff; }
    </style>
</head>
<body>
    <div class="calc-box">
        <h2 style="text-align:center; font-size: 1.1rem; margin-bottom: 15px; color: #66fcf1;">🔢 고감독 스마트 계산기 (v1.0)</h2>
        <input type="text" id="display" readonly value="0">
        <div class="grid">
            <button class="c" onclick="clearD()">C</button>
            <button class="op" onclick="press('/')">/</button>
            <button class="op" onclick="press('*')">*</button>
            <button class="op" onclick="press('-')">-</button>

            <button onclick="press('7')">7</button>
            <button onclick="press('8')">8</button>
            <button onclick="press('9')">9</button>
            <button class="op" onclick="press('+')">+</button>

            <button onclick="press('4')">4</button>
            <button onclick="press('5')">5</button>
            <button onclick="press('6')">6</button>
            <button class="eq" onclick="calc()">=</button>

            <button onclick="press('1')">1</button>
            <button onclick="press('2')">2</button>
            <button onclick="press('3')">3</button>
            <button onclick="press('0')">0</button>
        </div>
    </div>
    <script>
        let d = document.getElementById('display');
        function press(v) { if (d.value === '0') d.value = ''; d.value += v; }
        function clearD() { d.value = '0'; }
        function calc() { try { d.value = eval(d.value); } catch(e) { d.value = 'Error'; } }
    </script>
</body>
</html>
