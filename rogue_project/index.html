<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인피니트 소드: 무한 던전 - 용사 슈드 (Sude Paladin V6)</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@400;700;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background-color: #010204;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(56, 189, 248, 0.2) 0%, transparent 80%),
                linear-gradient(0deg, #010204 0%, #060913 100%);
            color: #f1f5f9;
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-frame {
            position: relative;
            width: 980px;
            background: rgba(10, 15, 30, 0.98);
            border: 3px solid #fbbf24;
            box-shadow: 
                0 0 0 2px #d97706,
                0 0 45px rgba(251, 191, 36, 0.5),
                inset 0 0 20px rgba(0, 0, 0, 0.9);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #header {
            padding: 10px 20px;
            background: linear-gradient(180deg, #1e1b4b 0%, #060913 100%);
            border-bottom: 2px solid #fbbf24;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title-box h1 {
            font-family: 'Press Start 2P', cursive, 'Noto Sans KR';
            font-size: 1.05rem;
            color: #fbbf24;
            text-shadow: 2px 2px 0 #000, 0 0 12px rgba(251, 191, 36, 0.7);
        }

        .title-box p {
            font-size: 0.75rem;
            color: #38bdf8;
            font-weight: bold;
            margin-top: 3px;
        }

        .stats-group {
            display: flex;
            gap: 12px;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #d97706;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-val {
            color: #fbbf24;
            font-weight: bold;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.75rem;
        }

        #phaser-container {
            position: relative;
            width: 980px;
            height: 570px;
            background: #000;
        }

        #footer {
            background: #090d16;
            border-top: 2px solid #334155;
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.78rem;
            color: #94a3b8;
        }

        .key-btn {
            background: #1e293b;
            border: 1px solid #475569;
            color: #fbbf24;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.72rem;
        }
    </style>
</head>
<body>

    <div id="game-frame">
        <div id="header">
            <div class="title-box">
                <h1>⚔️ 인피니트 소드: 무한 던전</h1>
                <p>🛡️ 주인공: 용사 슈드 (Sude) [팔라딘 V6 시안 100% 매칭]</p>
            </div>
            <div class="stats-group">
                <div class="stat-card">🗺️ 맵: <span id="stat-stage-name" class="stat-val">버섯 숲</span></div>
                <div class="stat-card">🏰 층수: <span id="stat-floor" class="stat-val">B1F</span></div>
                <div class="stat-card">💀 처치: <span id="stat-kills" class="stat-val">0</span></div>
                <div class="stat-card">🪙 골드: <span id="stat-gold" class="stat-val">0G</span></div>
            </div>
        </div>

        <div id="phaser-container"></div>

        <div id="footer">
            <div>
                용사 슈드 8방향 이동: <span class="key-btn">W</span><span class="key-btn">A</span><span class="key-btn">S</span><span class="key-btn">D</span> |
                기본 공격: <span class="key-btn">Space</span>
            </div>
            <div>
                스킬: <span class="key-btn">Q</span> 성스러운 베기 |
                <span class="key-btn">W</span> 신성한 방패 |
                <span class="key-btn">E</span> 축성 |
                <span class="key-btn">R</span> 천사의 검
            </div>
        </div>
    </div>

    <script>
        /* ==========================================================================
           Hero Sude Engine Setup
           ========================================================================== */
        const gameStats = {
            floor: 1, stageIndex: 0, kills: 0, gold: 0,
            playerHp: 120, maxHp: 120, playerMp: 60, maxMp: 60,
            sp: 0, maxSp: 100, level: 1, exp: 0, maxExp: 100,
            atkPower: 40
        };

        const STAGE_THEMES = [
            { id: 1, name: "속삭이는 버섯 숲", icon: "🍄", color: 0x166534 },
            { id: 2, name: "녹슨 기계 무덤", icon: "🤖", color: 0xea580c },
            { id: 3, name: "비명 지르는 소금 사막", icon: "🏜️", color: 0xca8a04 },
            { id: 4, name: "뒤틀린 차원의 회랑", icon: "🔮", color: 0x9333ea },
            { id: 5, name: "타오르는 영혼의 화산", icon: "🌋", color: 0xdc2626 },
            { id: 6, name: "얼어붙은 시간의 도시", icon: "❄️", color: 0x0284c7 }
        ];

        class BootScene extends Phaser.Scene {
            constructor() { super('BootScene'); }

            preload() {
                this.load.image('title_bg', 'assets/title.png');
                this.load.image('stages_sheet', 'assets/stages.jpg');
                this.load.image('sprites_sheet', 'assets/sprites.jpg');
            }

            create() {
                this.scene.start('TitleScene');
            }
        }

        class TitleScene extends Phaser.Scene {
            constructor() { super('TitleScene'); }

            create() {
                this.add.image(490, 285, 'title_bg').setDisplaySize(980, 570);

                const startTxt = this.add.text(490, 480, '✨ PRESS START TO PLAY (CLICK HERE) ✨', {
                    fontFamily: 'Press Start 2P, monospace',
                    fontSize: '20px',
                    color: '#ffffff',
                    stroke: '#000000',
                    strokeThickness: 6
                }).setOrigin(0.5);

                this.tweens.add({
                    targets: startTxt,
                    alpha: 0.2,
                    duration: 600,
                    ease: 'Power1',
                    yoyo: true,
                    repeat: -1
                });

                this.input.on('pointerdown', () => {
                    this.scene.start('DungeonScene');
                });
            }
        }

        class DungeonScene extends Phaser.Scene {
            constructor() { super('DungeonScene'); }

            create() {
                // Background Stage Graphic
                this.bgGraphic = this.add.rectangle(490, 285, 980, 570, STAGE_THEMES[0].color);

                // Grid Overlay
                this.add.grid(490, 285, 980, 570, 40, 40, 0x000000, 0.2, 0xfbbf24, 0.15);

                // Hero Sude (Paladin V6) Sprite Body
                this.player = this.physics.add.sprite(490, 285, 'sprites_sheet');
                this.player.setCrop(600, 70, 90, 90);
                this.player.setDisplaySize(64, 64);
                this.player.setCollideWorldBounds(true);

                // Hero Sude Floating Name Tag
                this.nameTag = this.add.text(490, 240, '🛡️ 용사 슈드 (Sude)', {
                    fontFamily: 'Noto Sans KR',
                    fontSize: '14px',
                    fontStyle: 'bold',
                    color: '#fbbf24',
                    stroke: '#000000',
                    strokeThickness: 4
                }).setOrigin(0.5);

                // Monsters Arcade Group
                this.monsters = this.physics.add.group();
                this.spawnMonsters();

                // Physics Collisions
                this.physics.add.overlap(this.player, this.monsters, this.handlePlayerMonsterCollision, null, this);

                // Keyboard Inputs
                this.cursors = this.input.keyboard.addKeys({
                    up: Phaser.Input.Keyboard.KeyCodes.W,
                    down: Phaser.Input.Keyboard.KeyCodes.S,
                    left: Phaser.Input.Keyboard.KeyCodes.A,
                    right: Phaser.Input.Keyboard.KeyCodes.D,
                    space: Phaser.Input.Keyboard.KeyCodes.SPACE,
                    q: Phaser.Input.Keyboard.KeyCodes.Q,
                    w: Phaser.Input.Keyboard.KeyCodes.W_KEY || Phaser.Input.Keyboard.KeyCodes.W,
                    e: Phaser.Input.Keyboard.KeyCodes.E,
                    r: Phaser.Input.Keyboard.KeyCodes.R
                });

                // Attack Key Event
                this.input.keyboard.on('keydown-SPACE', () => { this.castHolySlash(); });
                this.input.keyboard.on('keydown-Q', () => { this.castHolySlash(); });

                this.invincibleTimer = 0;
            }

            spawnMonsters() {
                const count = 6 + gameStats.floor * 2;
                for (let i = 0; i < count; i++) {
                    const mx = Phaser.Math.Between(100, 880);
                    const my = Phaser.Math.Between(100, 470);
                    const m = this.monsters.create(mx, my, 'sprites_sheet');
                    m.setCrop(160, 70, 70, 70);
                    m.setDisplaySize(48, 48);
                    m.hp = 40 + gameStats.floor * 10;
                    m.maxHp = m.hp;
                    m.speed = 40 + Math.random() * 20;
                }
            }

            castHolySlash() {
                // Crescent Slash Particle Effect
                const slashArc = this.add.circle(this.player.x + 30, this.player.y, 50, 0x38bdf8, 0.7);
                this.tweens.add({
                    targets: slashArc,
                    scale: 1.6,
                    alpha: 0,
                    duration: 180,
                    onComplete: () => slashArc.destroy()
                });

                this.monsters.getChildren().forEach(m => {
                    if (Phaser.Math.Distance.Between(this.player.x, this.player.y, m.x, m.y) < 110) {
                        m.hp -= gameStats.atkPower;
                        this.showFloatingText(m.x, m.y - 20, `-${gameStats.atkPower}`, '#ffffff');

                        if (m.hp <= 0) {
                            m.destroy();
                            gameStats.kills++;
                            gameStats.gold += 25;
                            document.getElementById('stat-kills').innerText = gameStats.kills;
                            document.getElementById('stat-gold').innerText = gameStats.gold + 'G';

                            if (this.monsters.countActive() === 0) {
                                gameStats.floor++;
                                document.getElementById('stat-floor').innerText = 'B' + gameStats.floor + 'F';
                                this.spawnMonsters();
                            }
                        }
                    }
                });
            }

            handlePlayerMonsterCollision(player, monster) {
                if (this.invincibleTimer <= 0) {
                    gameStats.playerHp = Math.max(0, gameStats.playerHp - 10);
                    this.invincibleTimer = 40;
                    this.showFloatingText(player.x, player.y - 20, `-10`, '#ef4444');
                    this.cameras.main.shake(100, 0.01);
                }
            }

            showFloatingText(x, y, msg, color) {
                const txt = this.add.text(x, y, msg, {
                    fontFamily: 'Noto Sans KR',
                    fontSize: '18px',
                    fontStyle: 'bold',
                    color: color
                }).setOrigin(0.5);

                this.tweens.add({
                    targets: txt,
                    y: y - 30,
                    alpha: 0,
                    duration: 600,
                    onComplete: () => txt.destroy()
                });
            }

            update(time, delta) {
                if (this.invincibleTimer > 0) this.invincibleTimer--;

                // Phaser Arcade Velocity Movement
                const speed = 220;
                this.player.setVelocity(0);

                if (this.cursors.left.isDown) this.player.setVelocityX(-speed);
                else if (this.cursors.right.isDown) this.player.setVelocityX(speed);

                if (this.cursors.up.isDown) this.player.setVelocityY(-speed);
                else if (this.cursors.down.isDown) this.player.setVelocityY(speed);

                // Sync Floating Name Tag with Hero Sude Position
                this.nameTag.setPosition(this.player.x, this.player.y - 45);

                // Monster Follow AI
                this.monsters.getChildren().forEach(m => {
                    this.physics.moveToObject(m, this.player, m.speed);
                });
            }
        }

        const config = {
            type: Phaser.WEBGL,
            width: 980,
            height: 570,
            parent: 'phaser-container',
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 0 },
                    debug: false
                }
            },
            scene: [BootScene, TitleScene, DungeonScene]
        };

        const game = new Phaser.Game(config);
    </script>
</body>
</html>
