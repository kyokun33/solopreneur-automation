<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Card News - Loss Avoidance</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #121212;
            font-family: 'Pretendard', sans-serif;
            overflow: hidden;
        }

        /* 1080x1350 (4:5 비율) 카드뉴스 규격 - 웹에서는 보기 좋게 스케일링 */
        .insta-card {
            width: 1080px;
            height: 1350px;
            background-color: #1a1a1a;
            position: relative;
            transform-origin: center;
            transform: scale(0.6); /* 웹 뷰어용 축소 */
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 상단 50%: 비주얼 영역 (경고, FOMO 자극) */
        .visual-area {
            height: 50%;
            background: linear-gradient(135deg, #2b0a0a, #110000);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* 배경 효과 */
        .visual-area::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, rgba(255, 51, 51, 0.2) 0%, transparent 70%);
            z-index: 1;
        }

        .alert-icon {
            font-size: 150px;
            color: #ff3333;
            margin-bottom: 40px;
            z-index: 2;
            text-shadow: 0 0 40px rgba(255, 51, 51, 0.5);
            animation: pulse 2s infinite;
        }

        .loss-counter {
            font-size: 120px;
            font-weight: 900;
            color: #ffffff;
            z-index: 2;
            letter-spacing: -3px;
        }

        .loss-counter span {
            color: #ff3333;
        }

        /* 하단 50%: 텍스트 패널 */
        .text-area {
            height: 50%;
            background-color: #222222;
            padding: 80px 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-sizing: border-box;
            word-break: keep-all; /* 단어 잘림 방지 */
            border-top: 2px solid #333;
        }

        .title {
            font-size: 75px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.3;
            margin-bottom: 50px;
        }

        .description {
            font-size: 45px;
            font-weight: 400;
            color: #b0b0b0;
            line-height: 1.6;
        }

        .description strong {
            color: #ffffff;
            font-weight: 600;
        }

        .cta-badge {
            margin-top: 60px;
            align-self: flex-start;
            background-color: #ff3333;
            color: white;
            padding: 20px 40px;
            border-radius: 50px;
            font-size: 35px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 반응형 뷰어를 위한 스케일링 */
        @media (max-height: 900px) {
            .insta-card { transform: scale(0.5); }
        }
        @media (max-height: 700px) {
            .insta-card { transform: scale(0.4); }
        }
    </style>
</head>
<body>

    <div class="insta-card" id="card">
        <!-- 상단 비주얼 영역 -->
        <div class="visual-area">
            <div class="alert-icon">⚠️</div>
            <div class="loss-counter">시간당 <span>$55</span> 손실</div>
        </div>

        <!-- 하단 텍스트 영역 -->
        <div class="text-area">
            <div class="title">
                무료 버전이 최고라는 생각,<br>
                당신의 지갑을 비우고 있습니다.
            </div>
            <div class="description">
                지금까지 무료로 사용하셨다면,<br>
                당신은 이미 <strong>숨겨진 비용 $55</strong>를<br>
                매시간 지불하며 손해 보고 있습니다.<br><br>
                
                무의식적인 시간 낭비를 멈추고<br>
                고고플랙스와 함께 완전 자동화를 시작하세요.
            </div>
            <div class="cta-badge">지금 손실 회피하기 ➔</div>
        </div>
    </div>

</body>
</html>
