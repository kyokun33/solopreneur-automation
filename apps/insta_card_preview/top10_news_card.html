<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Card News - Top 10 News</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #121212;
            font-family: 'Pretendard', sans-serif;
            overflow: hidden;
        }

        /* 1080x1350 (4:5 비율) 카드뉴스 규격 */
        .insta-card {
            width: 1080px;
            height: 1350px;
            background-color: #1a1a1a;
            position: relative;
            transform-origin: center;
            transform: scale(0.6); /* 웹 뷰어용 축소 */
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 상단 50%: 뉴스 관련 비주얼 영역 */
        .visual-area {
            height: 50%;
            background: linear-gradient(135deg, #0a192f, #020c1b);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 50px;
        }

        .category-badge {
            background-color: #64ffda;
            color: #0a192f;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 40px;
            font-weight: 800;
            margin-bottom: 40px;
            z-index: 2;
        }

        .news-rank {
            font-size: 150px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.1);
            position: absolute;
            top: 20px;
            left: 50px;
        }

        /* 하단 50%: 텍스트 패널 */
        .text-area {
            height: 50%;
            background-color: #222222;
            padding: 80px 100px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            box-sizing: border-box;
            word-break: keep-all; /* 단어 잘림 방지 */
            border-top: 2px solid #333;
        }

        .news-title {
            font-size: 70px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.4;
            margin-bottom: 50px;
        }

        .news-source {
            font-size: 45px;
            font-weight: 600;
            color: #8892b0;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .news-source::before {
            content: '';
            display: inline-block;
            width: 15px;
            height: 15px;
            background-color: #64ffda;
            border-radius: 50%;
        }

        /* 반응형 뷰어를 위한 스케일링 */
        @media (max-height: 900px) {
            .insta-card { transform: scale(0.5); }
        }
        @media (max-height: 700px) {
            .insta-card { transform: scale(0.4); }
        }
    </style>
</head>
<body>

    <div class="insta-card" id="card">
        <!-- 상단 비주얼 영역 -->
        <div class="visual-area">
            <div class="news-rank">#1</div>
            <div class="category-badge">오늘의 주요 뉴스</div>
        </div>

        <!-- 하단 텍스트 영역 -->
        <div class="text-area">
            <div class="news-title">
                용혜인, 관례 깨고 ‘의원직 유지’…<br>
                “사퇴하면 원외 정당 돼”
            </div>
            <div class="news-source">
                한겨레 (Google News)
            </div>
        </div>
    </div>

</body>
</html>
