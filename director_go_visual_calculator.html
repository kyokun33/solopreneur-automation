<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>🎬 고감독 AI 가상 포인터 & 라이브 시각화 계산기</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Noto+Sans+KR:wght@400;700&display=swap');
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at top center, #1E1E2E 0%, #0F0F17 100%);
      color: #F8FAFC;
      font-family: 'Outfit', 'Noto Sans KR', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* HUD Top Banner */
    .hud-banner {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30, 30, 46, 0.85);
      backdrop-filter: blur(16px);
      border: 2px solid #38BDF8;
      border-radius: 40px;
      padding: 12px 30px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 10px 30px rgba(56, 189, 248, 0.25);
      z-index: 9999;
    }

    .hud-badge {
      background: #38BDF8;
      color: #0F172A;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 13px;
    }

    .hud-text {
      font-size: 16px;
      font-weight: 600;
      color: #E2E8F0;
    }

    /* Calculator Container */
    .calc-box {
      width: 360px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    .calc-title {
      font-size: 14px;
      font-weight: 600;
      color: #94A3B8;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .display {
      background: #020617;
      border: 1px solid #1E293B;
      border-radius: 16px;
      padding: 20px;
      text-align: right;
      font-size: 32px;
      font-weight: 800;
      color: #38BDF8;
      letter-spacing: 1px;
      margin-bottom: 20px;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
      height: 75px;
      overflow: hidden;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .btn {
      background: #1E293B;
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: #F1F5F9;
      font-size: 20px;
      font-weight: 600;
      height: 60px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn.op {
      background: #0EA5E9;
      color: #0F172A;
      font-weight: 800;
    }

    .btn.eq {
      background: linear-gradient(135deg, #10B981 0%, #059669 100%);
      color: #FFFFFF;
      font-weight: 800;
      grid-column: span 2;
    }

    .btn.active {
      transform: scale(0.92);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.8);
      background: #38BDF8;
      color: #0F172A;
    }

    /* Neon AI Pointer */
    #ai-pointer {
      position: fixed;
      width: 32px;
      height: 32px;
      background: radial-gradient(circle, #F97316 0%, #EA580C 100%);
      border: 3px solid #FFFFFF;
      border-radius: 50%;
      pointer-events: none;
      z-index: 100000;
      box-shadow: 0 0 25px #F97316, 0 0 45px rgba(249, 115, 22, 0.6);
      transition: left 0.45s cubic-bezier(0.25, 1, 0.5, 1), top 0.45s cubic-bezier(0.25, 1, 0.5, 1), transform 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    #ai-pointer::after {
      content: '🤖';
      font-size: 16px;
    }

    #ai-pointer.click {
      transform: scale(0.7);
      background: #10B981;
      box-shadow: 0 0 35px #10B981;
    }
  </style>
</head>
<body>

  <!-- Top Status HUD -->
  <div class="hud-banner">
    <div class="hud-badge">LIVE DEMO</div>
    <div class="hud-text" id="hud-text">🎬 고감독 AI 가상 포인터 시각화 준비 중...</div>
  </div>

  <!-- Calculator Box -->
  <div class="calc-box">
    <div class="calc-title">
      <span>LOG PROJECT CALC</span>
      <span style="color:#38BDF8">월 1,800만 목표</span>
    </div>
    <div class="display" id="display">0</div>
    <div class="grid">
      <div class="btn" id="b-c">C</div>
      <div class="btn" id="b-div">/</div>
      <div class="btn" id="b-mul">*</div>
      <div class="btn op" id="b-sub">-</div>

      <div class="btn" id="b-7">7</div>
      <div class="btn" id="b-8">8</div>
      <div class="btn" id="b-9">9</div>
      <div class="btn op" id="b-add">+</div>

      <div class="btn" id="b-4">4</div>
      <div class="btn" id="b-5">5</div>
      <div class="btn" id="b-6">6</div>
      <div class="btn op" id="b-00">00</div>

      <div class="btn" id="b-1">1</div>
      <div class="btn" id="b-2">2</div>
      <div class="btn" id="b-3">3</div>
      <div class="btn" id="b-0">0</div>

      <div class="btn eq" id="b-eq">=</div>
    </div>
  </div>

  <!-- AI Pointer -->
  <div id="ai-pointer"></div>

  <script>
    const pointer = document.getElementById('ai-pointer');
    const hudText = document.getElementById('hud-text');
    const display = document.getElementById('display');

    function updateHud(text) {
      hudText.textContent = text;
    }

    function setDisplay(val) {
      display.textContent = val;
    }

    async function movePointerTo(btnId, click=true) {
      const btn = document.getElementById(btnId);
      if (!btn) return;
      const rect = btn.getBoundingClientRect();
      const targetX = rect.left + rect.width / 2 - 16;
      const targetY = rect.top + rect.height / 2 - 16;

      pointer.style.left = targetX + 'px';
      pointer.style.top = targetY + 'px';

      await new Promise(r => setTimeout(r, 600));

      if (click) {
        pointer.classList.add('click');
        btn.classList.add('active');
        await new Promise(r => setTimeout(r, 250));
        pointer.classList.remove('click');
        btn.classList.remove('active');
      }
    }

    async function startLiveCalculationShow() {
      await new Promise(r => setTimeout(r, 1000));
      
      updateHud("🎬 고감독이 대표님을 위해 로그 프로젝트 목표 계산을 시작합니다!");
      await new Promise(r => setTimeout(r, 1200));

      // Clear
      updateHud("1️⃣ [C] 초기화 클릭...");
      await movePointerTo('b-c');
      setDisplay('0');

      // Type 1,000만
      updateHud("2️⃣ [1,000만 원] 목표 금액 입력 중...");
      await movePointerTo('b-1'); setDisplay('1');
      await movePointerTo('b-0'); setDisplay('10');
      await movePointerTo('b-00'); setDisplay('1,000');
      await movePointerTo('b-00'); setDisplay('100,000');
      await movePointerTo('b-00'); setDisplay('10,000,000');

      // Multiply by 1.8 (시안 5 멀티플)
      updateHud("3️⃣ [*] 시안 5 무인 자율 파이프라인 멀티플 곱하기...");
      await movePointerTo('b-mul');

      await movePointerTo('b-1'); setDisplay('1.8');
      await movePointerTo('b-8'); setDisplay('1.8');

      // Equals
      updateHud("4️⃣ [=] 최종 예상 월 매출 계산 완료!");
      await movePointerTo('b-eq');
      setDisplay('18,000,000 원');

      updateHud("🎉 [완성] 고감독 시각화 포인터 연산 완료! (월 1,800만 원 달성 파이프라인)");
    }

    window.onload = startLiveCalculationShow;
  </script>
</body>
</html>
