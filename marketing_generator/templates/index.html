<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 마케팅 카피라이터 & 카드뉴스 자동 생성기</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <div class="logo">🎨 AI CopyWriter Pro</div>
        <div>100% 무인 1인기업 마케팅 솔루션</div>
    </header>

    <main>
        <div style="text-align: center; margin-bottom: 30px;">
            <h1 style="font-size: 2.2rem; margin-bottom: 10px;">✨ 10초 만에 끝내는 마케팅 원고 & 카드뉴스 생성</h1>
            <p style="color:var(--text-muted);">상품 정보만 입력하면 블로그 글, 인스타 캡션, 카드뉴스 대본이 동시에 완성됩니다.</p>
        </div>

        <div class="grid">
            <div class="card">
                <h2 style="font-size: 1.2rem; margin-bottom: 20px;">📌 상품 정보 입력</h2>
                <form id="marketingForm">
                    <div class="form-group">
                        <label>상품/서비스명</label>
                        <input type="text" id="product_name" class="form-control" placeholder="예: AI 1인기업 프롬프트 팩" required>
                    </div>
                    <div class="form-group">
                        <label>타겟 고객층</label>
                        <input type="text" id="target_audience" class="form-control" placeholder="예: 1인 기업가, 예비 창업자" required>
                    </div>
                    <div class="form-group">
                        <label>핵심 혜택/강점</label>
                        <input type="text" id="key_benefit" class="form-control" placeholder="예: 업무시간 하루 4시간 단축" required>
                    </div>
                    <button type="submit" class="btn-submit" id="btnSubmit">🚀 10초 마케팅 세트 자동 생성</button>
                </form>
            </div>

            <div class="card">
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('blog')">📝 블로그 포스팅</button>
                    <button class="tab-btn" onclick="switchTab('insta')">📸 인스타그램 캡션</button>
                    <button class="tab-btn" onclick="switchTab('cardnews')">🖼️ 카드뉴스 대본 (5장)</button>
                </div>

                <div id="tab-blog" class="tab-content active">
                    <p style="color:#6b7280; text-align:center; margin-top:100px;">왼쪽 폼에 정보를 입력해 주세요.</p>
                </div>

                <div id="tab-insta" class="tab-content">
                    <p style="color:#6b7280; text-align:center; margin-top:100px;">왼쪽 폼에 정보를 입력해 주세요.</p>
                </div>

                <div id="tab-cardnews" class="tab-content">
                    <p style="color:#6b7280; text-align:center; margin-top:100px;">왼쪽 폼에 정보를 입력해 주세요.</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        let currentResult = null;

        document.getElementById('marketingForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.innerText = "⏳ 마케팅 콘텐츠 생성 중...";
            btn.disabled = true;

            const payload = {
                product_name: document.getElementById('product_name').value,
                target_audience: document.getElementById('target_audience').value,
                key_benefit: document.getElementById('key_benefit').value
            };

            try {
                const res = await fetch('/api/generate-marketing', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                currentResult = data;

                if(data.success) {
                    document.getElementById('tab-blog').innerHTML = `<pre style="white-space:pre-wrap; font-family:inherit;">${data.blog_post}</pre>`;
                    document.getElementById('tab-insta').innerHTML = `<pre style="white-space:pre-wrap; font-family:inherit;">${data.insta_caption}</pre>`;
                    
                    let cardHtml = '<div class="card-news-grid">';
                    data.card_news.forEach(item => {
                        cardHtml += `
                            <div class="card-news-item">
                                <div style="font-size:0.8rem; color:#60a5fa; margin-bottom:6px;">Slide ${item.slide}</div>
                                <div style="font-weight:700; margin-bottom:8px;">${item.title}</div>
                                <div style="font-size:0.85rem; color:#d1d5db;">${item.content}</div>
                            </div>
                        `;
                    });
                    cardHtml += '</div>';
                    document.getElementById('tab-cardnews').innerHTML = cardHtml;
                }
            } catch(e) {
                alert("생성 실패");
            } finally {
                btn.innerText = "🚀 10초 마케팅 세트 자동 생성";
                btn.disabled = false;
            }
        });

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
        }
    </script>
</body>
</html>
